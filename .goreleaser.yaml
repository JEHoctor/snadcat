# Release build for the snadcat CLI.
#
# Triggered by pushing a v* tag; see .github/workflows/release.yml. Everything
# downstream of a release (package managers, PyPI/npm wrappers) consumes these
# artifacts rather than rebuilding — see plans/2026-08-07-go-port.md §4.2.
version: 2

project_name: snadcat

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: snadcat
    main: ./cmd/snadcat
    binary: snadcat
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Trim local paths and stamp the version the CLI reports. Without the
    # -X the binary falls back to the toolchain's VCS stamps, which a release
    # archive should not depend on.
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/jehoctor/snadcat/internal/version.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Apache-2.0 §4 requires the licence and NOTICE to travel with every
    # redistribution, and these archives are the redistribution.
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  # Explicitly true, not "auto": auto only marks a release as a pre-release
  # when the tag carries a semver pre-release suffix (v1.0.0-rc1), so v0.0.1
  # would publish as stable. Every v0.0.x is a pre-release in substance —
  # docker support is about to be removed — so say so. Revisit at v0.1.0.
  prerelease: true
  header: |
    ## snadcat {{ .Tag }}

    Early release of the Go CLI. See the README for install options and for
    what "early" means — notably that docker support is on its way out in
    favour of podman.
